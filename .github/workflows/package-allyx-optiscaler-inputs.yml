name: Collect Ally X OptiScaler FSR4 inputs
on:
  push:
    branches: ['package/allyx-optiscaler-fsr4-20261009']
    paths: ['.github/workflows/package-allyx-optiscaler-inputs.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify official release and collect matching source
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess, urllib.request, zipfile
          out = pathlib.Path('delivery')
          out.mkdir()
          work = pathlib.Path('work')
          work.mkdir()
          headers = {'User-Agent': 'Ally-X-OptiScaler-kit/1.0'}
          def download(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=180) as r:
                  return r.read()
          repo = 'optiscaler/OptiScaler'
          release = json.loads(download('https://api.github.com/repos/' + repo + '/releases/tags/v0.9.4'))
          (out / 'release.json').write_text(json.dumps(release, indent=2), encoding='utf-8')
          name = 'Optiscaler_0.9.4-final.20260718._MM.7z'
          asset = next(a for a in release['assets'] if a['name'] == name)
          expected = '575cb4df866116093df75af607e37fd70e10f5163e0f23fd5c804142e80ef0ad'
          data = download(asset['browser_download_url'])
          actual = hashlib.sha256(data).hexdigest()
          assert actual == expected, 'Release SHA256 mismatch'
          assert len(data) == asset['size'], 'Release size mismatch'
          archive = work / name
          archive.write_bytes(data)
          subprocess.run(['7z', 't', str(archive)], check=True)
          runtime = work / 'runtime'
          subprocess.run(['7z', 'x', str(archive), '-o' + str(runtime), '-y'], check=True)
          files = [p for p in runtime.rglob('*') if p.is_file()]
          assert any(p.name.lower() == 'optiscaler.dll' for p in files)
          assert any(p.name.lower() == 'optiscaler.ini' for p in files)
          assert any('fidelityfx' in p.name.lower() and 'upscaler' in p.name.lower() for p in files)
          records = []
          for p in sorted(files):
              record = {'path': p.relative_to(runtime).as_posix(), 'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
              records.append(record)
              print(json.dumps(record))
          with zipfile.ZipFile(out / 'OptiScaler-0.9.4-runtime-original.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for p in files:
                  z.write(p, p.relative_to(runtime))
          source_url = 'https://codeload.github.com/' + repo + '/zip/refs/tags/v0.9.4'
          source = download(source_url)
          (out / 'OptiScaler-0.9.4-source.zip').write_bytes(source)
          with zipfile.ZipFile(out / 'OptiScaler-0.9.4-source.zip') as z:
              assert z.testzip() is None
          tree = json.loads(download('https://api.github.com/repos/' + repo + '/git/trees/v0.9.4?recursive=1'))
          assert not tree.get('truncated', False)
          pins = [i for i in tree['tree'] if i['mode'] == '160000']
          (out / 'submodule-pins.json').write_text(json.dumps(pins, indent=2), encoding='utf-8')
          provenance = {'release': 'v0.9.4', 'release_url': release['html_url'], 'archive_name': name, 'archive_url': asset['browser_download_url'], 'archive_bytes': len(data), 'archive_sha256': actual, 'source_url': source_url, 'source_sha256': hashlib.sha256(source).hexdigest(), 'root_tree_sha': tree['sha'], 'runtime_files': records, 'validation': 'Archive hash/CRC and static contents only; no game or GPU execution'}
          (out / 'PROVENANCE.json').write_text(json.dumps(provenance, indent=2), encoding='utf-8')
      - name: Upload verified package inputs
        uses: actions/upload-artifact@v4
        with:
          name: Ally-X-OptiScaler-FSR4-verified-inputs
          path: delivery/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
