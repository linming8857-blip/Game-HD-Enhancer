name: Package Ally X FSR1 prerequisites
on:
  push:
    branches: ['package/allyx-fsr1-20261009']
    paths: ['.github/workflows/package-allyx-fsr1.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download unmodified upstream binary and matching source
        shell: python
        run: |
          import hashlib, json, pathlib, urllib.request, zipfile
          root = pathlib.Path('delivery')
          root.mkdir()
          items = [
            ('Magpie-v0.12.1-x64.zip', 'https://github.com/Blinue/Magpie/releases/download/v0.12.1/Magpie-v0.12.1-x64.zip', '8bc8bc233438f546b7996b00b21d7376f4f7d3d8a4940e6a8800babd2225b2de'),
            ('Magpie-v0.12.1-source.zip', 'https://codeload.github.com/Blinue/Magpie/zip/refs/tags/v0.12.1', None),
          ]
          records = []
          for name, url, expected in items:
            req = urllib.request.Request(url, headers={'User-Agent': 'Ally-X-FSR1-package/1.0'})
            with urllib.request.urlopen(req, timeout=120) as response:
              data = response.read()
            digest = hashlib.sha256(data).hexdigest()
            if expected is not None and digest != expected:
              raise RuntimeError('Official release SHA256 mismatch: ' + name)
            path = root / name
            path.write_bytes(data)
            with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad:
                raise RuntimeError('Corrupt ZIP member: ' + bad)
              if name.endswith('x64.zip'):
                names = z.namelist()
                assert any(n.lower().endswith('magpie.exe') for n in names)
                assert any(n.lower().endswith('fsr_easu.hlsl') for n in names)
                assert any(n.lower().endswith('fsr_rcas.hlsl') for n in names)
                print('Binary package members:', '\n'.join(names[:25]))
            record = {'name': name, 'url': url, 'bytes': len(data), 'sha256': digest}
            records.append(record)
            print(json.dumps(record))
          (root / 'UPSTREAM_PROVENANCE.json').write_text(json.dumps(records, indent=2), encoding='utf-8')
      - name: Upload verified inputs
        uses: actions/upload-artifact@v4
        with:
          name: Ally-X-FSR1-verified-upstream
          path: delivery/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
